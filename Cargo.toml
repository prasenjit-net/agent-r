[workspace]
members = ["agent-core", "agent-llm", "agent-tools", "agent-mcp", "examples/demo", "examples/ops-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/prasenjit-net/agent-r"

[workspace.dependencies]
agent-core = { path = "agent-core", version = "0.1.0" }
agent-llm = { path = "agent-llm", version = "0.1.0" }
agent-mcp = { path = "agent-mcp", version = "0.1.0" }
agent-tools = { path = "agent-tools", version = "0.1.0" }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "fs", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
